<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking Confirmed | CineBook</title>

    <link
        rel="stylesheet"
        href="css/ticket.css"
    >

</head>


<body>


    <div class="ticket-page">


        <!-- SUCCESS -->

        <div class="success-icon">
            ✓
        </div>


        <h1>
            Booking Confirmed!
        </h1>


        <p class="success-text">
            Your movie ticket has been booked successfully.
        </p>


        <!-- TICKET -->

        <div class="ticket">


            <!-- TICKET TOP -->

            <div class="ticket-top">

                <div>

                    <span>
                        CINEBOOK
                    </span>

                    <h2 id="movieName">
                        Movie
                    </h2>

                </div>


                <div class="ticket-status">
                    CONFIRMED
                </div>

            </div>


            <!-- BOOKING ID -->

            <div class="booking-id">

                <span>
                    BOOKING ID
                </span>

                <strong id="bookingId">
                    -
                </strong>

            </div>


            <!-- DETAILS -->

            <div class="ticket-details">


                <div>

                    <span>
                        CUSTOMER
                    </span>

                    <strong id="customer">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        THEATRE
                    </span>

                    <strong id="theatre">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        SHOW TIME
                    </span>

                    <strong id="showTime">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        SEATS
                    </span>

                    <strong id="seats">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        BOOKING DATE
                    </span>

                    <strong id="bookingDate">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        TOTAL
                    </span>

                    <strong
                        id="total"
                        class="price"
                    >
                        ₹0
                    </strong>

                </div>


            </div>


            <!-- DIVIDER -->

            <div class="ticket-divider"></div>


            <!-- QR STYLE -->

            <div class="ticket-bottom">

                <div class="qr">

                    <div class="qr-grid">
                        ▦
                    </div>

                </div>


                <div>

                    <h3>
                        Show this ticket
                    </h3>

                    <p>
                        Please keep your Booking ID
                        for future reference.
                    </p>

                </div>

            </div>


        </div>


        <!-- BUTTONS -->

        <div class="ticket-actions">

            <button
                onclick="window.location.href='home.html'"
            >
                ← Back to Home
            </button>


            <button
                onclick="window.location.href='history.html'"
            >
                My Bookings
            </button>

        </div>


    </div>


    <script src="js/ticket.js"></script>

</body>

</html>
